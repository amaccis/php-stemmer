name: CI

on:
  pull_request: ~
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      matrix:
        container:
          - "amaccis/php-libstemmer:8.2.32-3.1.1"
          - "amaccis/php-libstemmer:8.3.32-3.1.1"
          - "amaccis/php-libstemmer:8.4.23-3.1.1"
          - "amaccis/php-libstemmer:8.5.8-3.1.1"

    container:
      image: ${{ matrix.container }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install dependencies
        run: composer install
      - name: Run tests
        run: vendor/bin/phpunit
      - name: Run static analysis
        run: vendor/bin/phpstan